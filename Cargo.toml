[package]
name = "wp-connectors-labs"
version = "0.1.13" #@gxl:set(version)
edition = "2024"
description = "Experimental connectors for warp-parse: dmdb"
authors = ["WP Labs Team"]
license = "Apache-2.0"
repository = "https://github.com/wp-labs/wp-connectors"

[features]
default = ["dmdb", "udp"]
dmdb = []
udp = ["wp-data-fmt"]

[dependencies]
wp-connector-api = "0.14"
wp-model-core = "0.10"
wp-log = "0.5"
wp-conf-base = "0.7"
wp-data-fmt = { version = "0.10", optional = true }
orion-error = "0.9"
orion_conf = { version = "0.8", features = ["yaml", "toml"] }

async-trait = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
socket2 = "0.6"
chrono = "0.4"
educe = { version = "0.6", default-features = false, features = ["Debug", "Default"] }
bytes = "1"
libloading = "0.8"
thiserror = "2"
hex = "0.4"

[dev-dependencies]
httpmock = "0.8"
quickcheck = "1.0"
quickcheck_macros = "1.0"
